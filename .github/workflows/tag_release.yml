name: "Tagged release"

on:
  push:
    tags:
      - "git_v*"

jobs:
  pre-release:
    runs-on: "ubuntu-latest"
    permissions:
      # needed to create the release and upload its assets
      contents: "write"
    steps:
      - name: "Checkout source code"
        uses: "actions/checkout@v5"
        with:
          fetch-depth: 0

      - name: "Install Linux deps"
        run: |
          sudo apt install gettext git

      - name: "Creating the archive"
        run: |
          git fetch --tags --force && ./utils/archive.sh

      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          # without this the action derives the release from the tag, and
          # refuses "git_v1.2.0" for not being a semantic version
          automatic_release_tag: "${{ github.ref_name }}"
          title: "${{ github.ref_name }}"
          prerelease: false
          files: |
            LICENSE
            gameshell.sh
            Dockerfile
