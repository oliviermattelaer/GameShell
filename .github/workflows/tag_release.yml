name: "Tagged release"

on:
  push:
    tags:
      - "parcomp_v*"

jobs:
  pre-release:
    runs-on: "ubuntu-latest"
    permissions:
      # needed to create the release and upload its assets
      contents: "write"
    steps:
      - name: "Checkout source code"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      - name: "Install Linux deps"
        run: |
          sudo apt install gettext git

      - name: "Creating the archive"
        run: |
          git fetch --tags --force && ./utils/archive.sh

      # NOTE: marvinpinto/action-automatic-releases only accepts tags that
      # parse as semantic versions, which "parcomp_v..." does not
      - uses: "softprops/action-gh-release@v2"
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            LICENSE
            gameshell.sh
            Dockerfile
