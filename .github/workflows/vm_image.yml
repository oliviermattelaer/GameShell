name: "VM image"

on:
  push:
    tags:
      - "v*"
  # allows rebuilding the VM without making a new release
  workflow_dispatch:

jobs:
  vm:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
    steps:
      - name: "Checkout source code"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      - name: "Install Linux deps"
        run: |
          sudo apt-get update
          # "passt" provides the user-mode networking libguestfs needs to
          # install packages inside the image; it is only a Recommends
          sudo apt-get install --no-install-recommends --assume-yes \
            gettext git curl qemu-utils libguestfs-tools passt
          # VBoxManage is only used to write the OVF descriptor: its kernel
          # module is never needed, so a failure to build it is not fatal
          sudo apt-get install --assume-yes virtualbox || true
          command -v VBoxManage

      - name: "Let an unprivileged build use the kernel and KVM"
        # The image is built as the normal user, because passt -- which gives
        # the guest its network -- refuses to run as root.  That user needs to
        # read the kernel libguestfs builds its appliance from (0600 on
        # Ubuntu), and to reach /dev/kvm, without which the build falls back
        # to plain emulation and takes forever.
        run: |
          sudo chmod 0644 /boot/vmlinuz-*
          if [ -e /dev/kvm ]
          then
            sudo chmod 0666 /dev/kvm
          fi

      - name: "Creating the archive"
        run: |
          git fetch --tags --force && ./utils/archive.sh

      - name: "Let passt use an unprivileged user namespace"
        # passt sandboxes itself in a user namespace, and Ubuntu confines any
        # unprivileged user namespace with a restrictive AppArmor profile.
        # passt then cannot create the PID file libguestfs asks it for ("PID
        # file open: Permission denied") and the whole build aborts.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: "Building the VM image"
        env:
          LIBGUESTFS_BACKEND: "direct"
          LIBGUESTFS_DEBUG: "1"
          LIBGUESTFS_TRACE: "1"
        run: |
          ./utils/build-vm.sh -a gameshell.sh -o gameshell.ova
          ls -lh gameshell.ova

      - name: "DEBUG show AppArmor denials"
        if: "failure()"
        run: |
          sudo dmesg | grep -i -E "apparmor|passt" | tail -30 || true

      - name: "Upload the VM image as a build artifact"
        uses: "actions/upload-artifact@v4"
        with:
          name: "gameshell-ova"
          path: "gameshell.ova"
          retention-days: 14
          compression-level: 0

      - name: "Attach the VM image to the release"
        if: "startsWith(github.ref, 'refs/tags/')"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # the release itself is created by the "Tagged release" workflow,
          # which runs in parallel with this one
          for _ in $(seq 30)
          do
            if gh release view "$tag" >/dev/null 2>&1
            then
              gh release upload "$tag" gameshell.ova --clobber
              exit 0
            fi
            echo "waiting for the release of $tag to be created..."
            sleep 20
          done
          echo "Error: no release found for $tag" >&2
          exit 1
