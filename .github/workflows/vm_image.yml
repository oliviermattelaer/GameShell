name: "VM image"

on:
  push:
    tags:
      - "parcomp_v*"
  # allows rebuilding the VM without making a new release
  workflow_dispatch:

jobs:
  vm:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
    steps:
      - name: "Checkout source code"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      - name: "Install Linux deps"
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes \
            gettext git curl qemu-utils qemu-system-x86 cloud-guest-utils e2fsprogs
          # VBoxManage is only used to write the OVF descriptor: its kernel
          # module is never needed, so a failure to build it is not fatal
          sudo apt-get install --assume-yes virtualbox || true
          command -v VBoxManage

      - name: "Creating the archive"
        run: |
          git fetch --tags --force && ./utils/archive.sh

      - name: "Building the VM image"
        run: |
          ./utils/build-vm.sh -a gameshell.sh -o gameshell.ova
          ls -lh gameshell.ova

      - name: "Upload the VM image as a build artifact"
        uses: "actions/upload-artifact@v4"
        with:
          name: "gameshell-ova"
          path: "gameshell.ova"
          retention-days: 14
          compression-level: 0

      - name: "Attach the VM image to the release"
        # creates the release if the "Tagged release" workflow, which runs in
        # parallel with this one, has not got there first
        if: "startsWith(github.ref, 'refs/tags/')"
        uses: "softprops/action-gh-release@v2"
        with:
          prerelease: false
          generate_release_notes: true
          files: "gameshell.ova"
