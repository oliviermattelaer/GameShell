name: "Docker image"

on:
  push:
    tags:
      - "parcomp_v*"
  # allows rebuilding an image without making a new release
  workflow_dispatch:

jobs:
  docker:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      packages: "write"
    steps:
      - name: "Checkout source code"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      - name: "Install Linux deps"
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes gettext git

      - name: "Creating the archive"
        # the image is built from the code being tagged, not from the
        # "latest" release the Dockerfile points to by default
        run: |
          git fetch --tags --force && ./utils/archive.sh

      - name: "Set up QEMU"
        uses: "docker/setup-qemu-action@v3"

      - name: "Set up Docker buildx"
        uses: "docker/setup-buildx-action@v3"

      - name: "Log in to the container registry"
        uses: "docker/login-action@v3"
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Compute image name and tags"
        id: "meta"
        uses: "docker/metadata-action@v5"
        with:
          images: "ghcr.io/${{ github.repository }}"
          # the tags are not semver, so the version cannot be parsed out of
          # them: match the "parcomp_v" prefix and keep whatever follows
          tags: |
            type=match,pattern=parcomp_v(.*),group=1
            type=ref,event=tag
            type=raw,value=latest

      - name: "Build and push the image"
        uses: "docker/build-push-action@v6"
        with:
          context: "."
          platforms: "linux/amd64,linux/arm64"
          build-args: |
            GSH_ARCHIVE=gameshell.sh
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
