name: "Docker image"

on:
  push:
    tags:
      - "git_v*"
  # allows rebuilding an image without making a new release
  workflow_dispatch:

jobs:
  docker:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      packages: "write"
    steps:
      - name: "Checkout source code"
        uses: "actions/checkout@v5"
        with:
          fetch-depth: 0

      - name: "Install Linux deps"
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes gettext git

      - name: "Creating the archive"
        # the image is built from the code being tagged, not from the
        # "latest" release the Dockerfile points to by default
        run: |
          git fetch --tags --force && ./utils/archive.sh

      - name: "Set up QEMU"
        uses: "docker/setup-qemu-action@v3"

      - name: "Set up Docker buildx"
        uses: "docker/setup-buildx-action@v3"

      - name: "Log in to the container registry"
        uses: "docker/login-action@v3"
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Strip the branch prefix from the tag"
        id: "version"
        # the tags of this branch are named "git_v1.2.0", which is not a
        # semantic version: give docker/metadata-action the "v1.2.0" part
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "value=${tag#git_}" >> "$GITHUB_OUTPUT"

      - name: "Compute image name and tags"
        id: "meta"
        uses: "docker/metadata-action@v5"
        with:
          images: "ghcr.io/${{ github.repository }}"
          # "latest=auto" only moves the "latest" tag for real releases, not
          # for pre-releases such as git_v1.2.0-rc1
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.value }}

      - name: "Build and push the image"
        uses: "docker/build-push-action@v6"
        with:
          context: "."
          platforms: "linux/amd64,linux/arm64"
          build-args: |
            GSH_ARCHIVE=gameshell.sh
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
